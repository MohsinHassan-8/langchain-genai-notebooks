<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Video Q&A</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h2>⚙️ Settings</h2>

        <label for="videoId">YouTube Video ID</label>
        <input id="videoId" type="text" value="LPZh9BOjkQs" />

        <label for="kSlider">Source chunks (k): <span id="kValue">5</span></label>
        <input id="kSlider" type="range" min="2" max="10" value="5" />

        <button id="loadVideoBtn" class="btn primary">Load video</button>
        <button id="clearChatBtn" class="btn secondary">🗑️ Clear chat</button>
      </div>

      <div class="sidebar-footer">
        <p>Answers are generated only from the video transcript. If the transcript doesn't contain the answer, the assistant will say so.</p>
        <div id="statusPill" class="status-pill idle">Idle</div>
      </div>
    </aside>

    <!-- Main panel -->
    <main class="main">
      <header class="app-header">
        <div class="title-row">
          <span class="emoji">🎬</span>
          <h1>YouTube Video Q&A</h1>
        </div>
        <p class="subtitle">Ask questions about a video and get answers grounded in its transcript</p>
      </header>

      <section id="chatWindow" class="chat-window">
        <div class="empty-state" id="emptyState">
          <p>👋 Ask a question about the loaded video to get started.</p>
        </div>
      </section>

      <form id="chatForm" class="chat-input-bar">
        <input
          id="questionInput"
          type="text"
          placeholder="Ask something about the video..."
          autocomplete="off"
        />
        <button type="submit" class="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="white" />
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
